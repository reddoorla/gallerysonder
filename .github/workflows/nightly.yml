name: nightly

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      script:
        description: 'Which Playwright tier to run'
        type: choice
        options:
          - test:nightly
          - test:e2e
          - test:scaffold
        default: test:nightly

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: pnpm exec playwright install --with-deps chromium

      # The `@smoke` tests that inspect the built client (slice-simulator) fail
      # without a production build, and `test:e2e` selects them.
      - run: pnpm build

      - name: Playwright (${{ inputs.script || 'test:nightly' }})
        env:
          SCRIPT: ${{ inputs.script || 'test:nightly' }}
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm run "$SCRIPT" --reporter=github,html

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A red nightly has no other reader: GitHub emails a failed scheduled run
      # only to whoever last edited the cron. Open (or update) one tracking issue.
      - if: failure() && (inputs.script || 'test:nightly') == 'test:nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRIPT: ${{ inputs.script || 'test:nightly' }}
        run: |
          title='Nightly Playwright failing'
          body="Run ($SCRIPT): $RUN_URL"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
